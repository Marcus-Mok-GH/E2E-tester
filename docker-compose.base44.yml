name: e2e-tester

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      base44.project: E2E Tester
      base44.kind: infra

  # One-shot: creates the `tasks` table the API expects (idempotent).
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: e2e
    volumes:
      - ./db/init.sql:/init.sql:ro
    command:
      ["sh", "-ec", "psql -h db -U e2e -d e2e -v ON_ERROR_STOP=1 -f /init.sql"]
    restart: "no"
    labels:
      base44.project: E2E Tester
      base44.kind: infra

  web:
    build:
      context: .
      dockerfile: docker/base44.Dockerfile
    restart: on-failure
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        npx playwright install chromium
        exec npm run dev
    ports:
      - "3000:5000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ms-playwright:/ms-playwright
    environment:
      # Same-origin wiring: vite (:5000) proxies /api -> api (:8000) in this container
      - DATABASE_URL=postgres://e2e:e2e@db:5432/e2e
      - PORT_API=8000
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - BASE44_PREVIEW_MODE
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          Promise.all([fetch('http://127.0.0.1:5000/'), fetch('http://127.0.0.1:8000/api/health')])
            .then((rs) => {
              const [web, api] = rs;
              if (!web.ok || !api.ok) {
                console.error('vite=' + web.status + ' api=' + api.status);
                process.exit(1);
              }
            })
            .catch((e) => { console.error('unhealthy: ' + e.message); process.exit(1); });
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      base44.project: E2E Tester
      base44.kind: web
      base44.port: "3000"

volumes:
  pgdata:
  node_modules:
  ms-playwright:
